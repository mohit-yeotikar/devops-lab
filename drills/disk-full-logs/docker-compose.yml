services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shopnotes
      POSTGRES_PASSWORD: shopnotes
      POSTGRES_DB: shopnotes
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopnotes -d shopnotes"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: ./app
    image: shopnotes-app:drill-disk-full
    environment:
      DATABASE_URL: postgresql://shopnotes:shopnotes@postgres:5432/shopnotes
      LOG_FILE: /var/log/shopnotes/app.log
    volumes:
      - logs:/var/log/shopnotes
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Sidecar that writes its own status log next to the app log.
  log-agent:
    image: alpine:3.20
    environment:
      LOG_LEVEL: debug
    volumes:
      - logs:/var/log/shopnotes
    command:
      - sh
      - -c
      - |
        if [ "$$LOG_LEVEL" = "debug" ]; then
          yes "$$(date -u +%FT%TZ) DEBUG log-agent: flush buffer queue=0 retry=0 shipped=0 target=app.log" >> /var/log/shopnotes/debug.log
        fi
        while true; do
          echo "$$(date -u +%FT%TZ) INFO log-agent: heartbeat" >> /var/log/shopnotes/agent.log
          sleep 30
        done
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

# The log volume is a 20 MB tmpfs (RAM). It is small on purpose and never touches your disk.
volumes:
  logs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=20m"
