# Release 1.4.2 of ShopNotes.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shopnotes
      POSTGRES_PASSWORD: shopnotes
      POSTGRES_DB: shopnotes
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopnotes -d shopnotes"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    image: shopnotes-app:1.4.2
    environment:
      DATABASE_URL: postgresql://shopnotes:shopnotes@postgres:5432/shopnotes
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8084:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
