services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shopnotes
      POSTGRES_PASSWORD: shopnotes
      POSTGRES_DB: shopnotes
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopnotes -d shopnotes"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: ./app
    image: shopnotes-app:drill-crashloop
    environment:
      DATABASE_URL: postgressql://shopnotes:shopnotes@postgres:5432/shopnotes
    depends_on:
      postgres:
        condition: service_healthy
    restart: always   # like Kubernetes: restart the container every time it dies

  nginx:
    image: nginx:alpine
    ports:
      - "8083:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
