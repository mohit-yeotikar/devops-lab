# Kubernetes variant of the drill (for k3d). See README.md for the commands.
apiVersion: v1
kind: Namespace
metadata:
  name: shopnotes-crashloop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: shopnotes-crashloop
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS notes (id SERIAL PRIMARY KEY, text TEXT NOT NULL);
    INSERT INTO notes (text) VALUES ('Welcome to ShopNotes!');
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: shopnotes-crashloop
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: shopnotes}
            - {name: POSTGRES_PASSWORD, value: shopnotes}
            - {name: POSTGRES_DB, value: shopnotes}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "shopnotes", "-d", "shopnotes"]
            periodSeconds: 2
          volumeMounts:
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
      volumes:
        - name: init
          configMap: {name: postgres-init}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shopnotes-crashloop
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopnotes-app
  namespace: shopnotes-crashloop
spec:
  replicas: 1
  selector:
    matchLabels: {app: shopnotes-app}
  template:
    metadata:
      labels: {app: shopnotes-app}
    spec:
      containers:
        - name: app
          image: shopnotes-app:drill-crashloop
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: postgressql://shopnotes:shopnotes@postgres:5432/shopnotes
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: shopnotes-app
  namespace: shopnotes-crashloop
spec:
  selector: {app: shopnotes-app}
  ports:
    - port: 5000
