services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=10"]   # small DB plan: only 10 connections
    environment:
      POSTGRES_USER: shopnotes
      POSTGRES_PASSWORD: shopnotes
      POSTGRES_DB: shopnotes
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopnotes -d shopnotes"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: ./app
    image: shopnotes-app:drill-db-pool
    environment:
      DATABASE_URL: postgresql://shopnotes:shopnotes@postgres:5432/shopnotes
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8086:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
