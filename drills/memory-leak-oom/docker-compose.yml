services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shopnotes
      POSTGRES_PASSWORD: shopnotes
      POSTGRES_DB: shopnotes
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopnotes -d shopnotes"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: ./app
    image: shopnotes-app:drill-memory-leak
    environment:
      DATABASE_URL: postgresql://shopnotes:shopnotes@postgres:5432/shopnotes
    mem_limit: 64m
    memswap_limit: 64m     # no swap: when the app uses more than 64 MB, the kernel kills it
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8085:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
